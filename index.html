<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alex Aguilar — Operations Leader · Software Builder</title>
<meta name="description" content="Alex Aguilar — Operations leader and full-stack developer. Founder of AxiomOps. NASA SBIR Phase I awardee. 8+ years in logistics and fulfillment operations." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ── Reset ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font:inherit;border:none;background:none}
ul,ol{list-style:none}
img{display:block;max-width:100%}

/* ── Tokens ──────────────────────────────────────── */
:root{
  --bg:#09090b; --bg-panel:#18181b;
  --fg1:#f4f4f5; --fg2:#e4e4e7; --fg3:#d4d4d8;
  --fg4:#a1a1aa; --fg5:#71717a; --fg6:#52525b;
  --font-sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
  --ease:cubic-bezier(0.16,1,0.3,1); --dur:220ms;
  --max-w:1160px; --px:36px;

  /* accent: blue */
  --accent:#3b82f6; --accent-bright:#60a5fa;
  --accent-dim:rgba(59,130,246,.12);
  --accent-border:rgba(59,130,246,.38);
  --accent-glow:rgba(37,99,235,.45);

  /* card (executive defaults) */
  --card-bg:linear-gradient(150deg,rgba(3,7,18,.96),rgba(15,23,42,.90));
  --card-border:rgba(63,63,70,.72);
  --card-border-h:rgba(96,165,250,.55);
  --card-r:var(--r-lg);
  --card-shadow:0 20px 50px -22px rgba(2,6,23,.9);
  --card-shadow-h:0 30px 65px -24px var(--accent-glow);
}

/* accent overrides */
[data-accent="cyan"]{
  --accent:#22d3ee; --accent-bright:#38bdf8;
  --accent-dim:rgba(34,211,238,.12);
  --accent-border:rgba(34,211,238,.38);
  --accent-glow:rgba(34,211,238,.38);
  --card-border-h:rgba(56,189,248,.55);
}
[data-accent="emerald"]{
  --accent:#10b981; --accent-bright:#34d399;
  --accent-dim:rgba(16,185,129,.12);
  --accent-border:rgba(16,185,129,.38);
  --accent-glow:rgba(16,185,129,.38);
  --card-border-h:rgba(52,211,153,.55);
}

/* editorial theme overrides */
[data-theme="editorial"]{
  --card-bg:rgba(255,255,255,.025);
  --card-border:rgba(255,255,255,.07);
  --card-border-h:var(--accent-border);
  --card-r:4px;
  --card-shadow:none;
  --card-shadow-h:0 8px 40px rgba(0,0,0,.5);
}

/* compact density */
[data-density="compact"] .section{padding:60px 0}
[data-density="compact"] .section-title{font-size:clamp(22px,2.8vw,34px)}

/* ── Base ─────────────────────────────────────────── */
body{background:var(--bg);color:var(--fg1);font-family:var(--font-sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--accent-dim);color:var(--fg1)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}

/* ── Entrance animations ─────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:none}
}
/* Hero — transform-only slide so elements are always visible before animation */
@keyframes slideUp{
  from{transform:translateY(16px)}
  to{transform:none}
}
.exec-eyebrow{animation:slideUp .5s ease forwards .05s}
.exec-name   {animation:slideUp .6s ease forwards .12s}
.exec-tagline{animation:slideUp .5s ease forwards .22s}
.exec-lead   {animation:slideUp .5s ease forwards .30s}
.exec-left .cta-row{animation:slideUp .5s ease forwards .38s}
.exec-right  {animation:slideUp .6s ease forwards .18s}
.edit-eyebrow{animation:slideUp .5s ease forwards .05s}
.edit-name   {animation:slideUp .7s ease forwards .1s}
.edit-rule   {animation:slideUp .4s ease forwards .32s}
.edit-tagline{animation:slideUp .4s ease forwards .38s}
.edit-lead   {animation:slideUp .4s ease forwards .44s}
.edit-hero-inner .cta-row{animation:slideUp .4s ease forwards .52s}
/* Below-fold sections — hidden until [data-reveal].in */
[data-reveal]{opacity:0;transform:translateY(18px);
  transition:opacity .65s var(--ease),transform .65s var(--ease)}
[data-reveal].in{opacity:1 !important;transform:none !important}
@media(prefers-reduced-motion:reduce){
  [data-reveal],[data-reveal].in{opacity:1!important;transform:none!important;transition:none;animation:none}
  .exec-eyebrow,.exec-name,.exec-tagline,.exec-lead,.exec-right,
  .edit-eyebrow,.edit-name,.edit-rule,.edit-tagline,.edit-lead{animation:none}
}

/* ── Layout ───────────────────────────────────────── */
.wrap{max-width:var(--max-w);margin:0 auto;padding:0 var(--px)}
.section{padding:100px 0}
.section-header{margin-bottom:52px}
.section-eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;
  letter-spacing:.18em;color:var(--fg5);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-eyebrow::before{content:'';display:block;width:20px;height:1px;background:var(--fg5)}
.section-title{font-size:clamp(26px,3.4vw,42px);font-weight:700;
  letter-spacing:-.025em;line-height:1.1;color:var(--fg1)}

[data-theme="editorial"] .section-eyebrow{text-transform:none;letter-spacing:.04em;font-weight:300}
[data-theme="editorial"] .section-title{font-weight:800;letter-spacing:-.04em}

/* ── Card primitive ──────────────────────────────── */
.card{background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-r);box-shadow:var(--card-shadow);
  position:relative;overflow:hidden;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--card-shadow-h);border-color:var(--card-border-h)}
/* glass sheen — executive only */
[data-theme="executive"] .card::before{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 45%);pointer-events:none;z-index:0}
[data-theme="executive"] .card::after{content:'';position:absolute;bottom:-20px;right:-20px;
  width:80px;height:80px;border-radius:50%;background:var(--accent);opacity:.07;
  filter:blur(24px);pointer-events:none;transition:opacity .4s}
[data-theme="executive"] .card:hover::after{opacity:.15}

/* ── Utility ─────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:var(--r-full);font-size:11px;font-weight:600;letter-spacing:.04em}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;
  box-shadow:0 0 6px currentColor;flex-shrink:0}
.pill-live{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.3)}

.tag{font-size:11px;font-weight:500;color:var(--fg4);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  padding:4px 10px;border-radius:var(--r-full)}
[data-theme="editorial"] .tag{border-radius:2px}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);
  font-size:13px;font-weight:600;padding:11px 20px;
  border-radius:var(--r-full);white-space:nowrap;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur),border-color var(--dur)}
.btn-primary{background:var(--accent);color:#fff;
  box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--accent-glow)}
.btn-ghost{background:transparent;color:var(--fg3);
  border:1px solid var(--card-border)}
.btn-ghost:hover{border-color:var(--card-border-h);color:var(--fg1)}
.btn-text{background:none;color:var(--accent-bright);font-size:13px;font-weight:500;padding:0;gap:4px}
.btn-text:hover{color:var(--fg1)}

[data-theme="editorial"] .btn{border-radius:3px}
[data-theme="editorial"] .btn-primary{box-shadow:none}

.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ── Nav ─────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;transition:background var(--dur),border-color var(--dur)}
.nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 var(--px);
  display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px}

/* executive nav */
[data-theme="executive"] .nav{background:rgba(24,24,27,.92);border-bottom:1px solid rgba(63,63,70,.5);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
[data-theme="executive"] .nav.scrolled{background:rgba(18,18,24,.96)}
.nav-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:0 4px 14px var(--accent-glow);letter-spacing:-.02em}
.nav-brand{display:flex;align-items:center;gap:10px;color:var(--fg1)}
.nav-brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.nav-brand-sub{font-size:11px;color:var(--fg5);letter-spacing:.02em;margin-top:1px}
.nav-brand-stack{display:flex;flex-direction:column;line-height:1.2}

/* editorial nav */
[data-theme="editorial"] .nav{padding:16px var(--px)}
[data-theme="editorial"] .nav-inner{background:rgba(9,9,11,.8);border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-full);padding:0 20px;backdrop-filter:blur(24px);height:50px;
  max-width:780px;margin:0 auto}
[data-theme="editorial"] .nav-brand-name{font-size:14px;font-weight:600;letter-spacing:-.02em}

.nav-links{display:flex;gap:2px;align-items:center}
.nav-link{font-size:13px;font-weight:500;color:var(--fg4);padding:7px 12px;
  border-radius:var(--r-sm);transition:color var(--dur),background var(--dur)}
.nav-link:hover,.nav-link.active{color:var(--fg1);background:rgba(255,255,255,.05)}
.nav-cta{font-size:12px;font-weight:600;color:#fff;background:var(--accent);
  padding:7px 14px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:6px;
  transition:transform var(--dur),box-shadow var(--dur)}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
.nav-toggle{display:none;color:var(--fg3);padding:6px;border-radius:var(--r-sm)}

/* ── Hero – Executive ────────────────────────────── */
.hero-exec{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;
  max-width:var(--max-w);margin:0 auto;padding:128px var(--px) 100px}
.exec-left{display:flex;flex-direction:column}
.exec-right{}
.exec-eyebrow{display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;
  color:var(--accent-bright);background:var(--accent-dim);
  border:1px solid var(--accent-border);padding:6px 14px;border-radius:var(--r-full);
  margin-bottom:24px;width:fit-content}
.exec-name{font-size:clamp(52px,7.5vw,90px);font-weight:800;letter-spacing:-.035em;
  line-height:.9;color:var(--fg1);margin-bottom:18px}
.exec-tagline{font-size:17px;font-weight:400;color:var(--fg3);letter-spacing:-.01em;margin-bottom:16px}
.exec-lead{font-size:15px;color:var(--fg4);line-height:1.75;max-width:460px;margin-bottom:28px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-tile{padding:26px 24px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--card-r);box-shadow:var(--card-shadow);position:relative;overflow:hidden;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.stat-tile:hover{transform:translateY(-4px) scale(1.02);box-shadow:var(--card-shadow-h);border-color:var(--card-border-h)}
.stat-tile::before{content:'';position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.06);filter:blur(22px);pointer-events:none}
.stat-tile::after{content:'';position:absolute;bottom:-14px;right:-14px;
  width:60px;height:60px;border-radius:50%;background:var(--accent);opacity:.09;filter:blur(20px);pointer-events:none}
.stat-val{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--fg1);line-height:1;margin-bottom:8px}
.stat-lbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;
  color:var(--fg4);margin-bottom:4px}
.stat-sub{font-size:11px;color:var(--fg6);font-family:var(--font-mono)}

/* ── Hero – Editorial ────────────────────────────── */
.hero-edit{min-height:100svh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:120px 0 80px}
.edit-hero-inner{max-width:860px;display:flex;flex-direction:column;align-items:center;gap:0}
.edit-eyebrow{font-size:11px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fg5);margin-bottom:32px}
.edit-name{display:flex;flex-direction:column;line-height:.88;letter-spacing:-.04em;margin-bottom:28px}
.edit-name-first{font-size:clamp(76px,13vw,152px);font-weight:800;color:var(--fg1)}
.edit-name-last{font-size:clamp(76px,13vw,152px);font-weight:300;color:var(--fg4)}
.edit-rule{width:40px;height:1px;background:var(--accent);margin:0 auto 28px}
.edit-tagline{font-size:18px;font-weight:300;color:var(--fg3);letter-spacing:.06em;margin-bottom:20px}
.edit-lead{font-size:15px;color:var(--fg5);line-height:1.85;max-width:520px;font-weight:300;margin-bottom:32px}

/* ── Projects ─────────────────────────────────────── */
.projects-list{display:flex;flex-direction:column;gap:18px}
.project-card{padding:34px;position:relative}
.project-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.project-num{font-family:var(--font-mono);font-size:11px;color:var(--fg6);letter-spacing:.08em}
.project-name{font-size:clamp(22px,2.8vw,30px);font-weight:700;letter-spacing:-.02em;color:var(--fg1);margin-bottom:4px}
.project-type{font-size:12px;font-weight:500;color:var(--fg5);text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px}
.project-desc{font-size:14px;color:var(--fg4);line-height:1.75;max-width:680px;margin-bottom:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.wins{display:flex;flex-direction:column;gap:8px;padding-top:18px;
  border-top:1px solid rgba(255,255,255,.05);margin-bottom:20px}
.win-item{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--fg4);line-height:1.5}
.win-dot{width:16px;height:16px;border-radius:50%;background:var(--accent-dim);
  border:1px solid var(--accent-border);flex-shrink:0;margin-top:2px;
  display:grid;place-items:center}
.win-dot svg{stroke:var(--accent-bright)}

[data-theme="editorial"] .project-type{text-transform:none;letter-spacing:.02em;font-weight:300;font-size:14px}
[data-theme="editorial"] .wins{border-top:1px solid rgba(255,255,255,.08)}
[data-theme="editorial"] .project-card{padding:40px 36px}

/* ── Timeline ─────────────────────────────────────── */
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.timeline::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;
  width:1px;background:rgba(255,255,255,.06)}
.tl-entry{display:flex;gap:24px;position:relative;padding-bottom:0}
.tl-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--card-border);
  background:var(--bg);flex-shrink:0;margin-top:14px;transition:border-color var(--dur),background var(--dur);
  position:relative;z-index:1}
.tl-entry:hover .tl-dot,.tl-entry--current .tl-dot{border-color:var(--accent);background:var(--accent-dim)}
.tl-entry--military .tl-dot{border-color:var(--fg6)}
.tl-body{flex:1;padding:12px 0 32px}
.tl-header{display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;margin-bottom:12px;cursor:pointer}
.tl-left{display:flex;flex-direction:column;gap:2px}
.tl-role{font-size:16px;font-weight:600;color:var(--fg1);letter-spacing:-.01em}
.tl-company{font-size:13px;font-weight:500;color:var(--accent-bright)}
.tl-entry--military .tl-company{color:var(--fg5)}
.tl-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.tl-period{font-size:12px;font-family:var(--font-mono);color:var(--fg5)}
.tl-location{font-size:11px;color:var(--fg6)}
.tl-badge{font-size:10px;font-weight:600;color:var(--accent-bright);
  background:var(--accent-dim);border:1px solid var(--accent-border);
  padding:2px 8px;border-radius:var(--r-full);letter-spacing:.06em;text-transform:uppercase}
.tl-wins{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.tl-win{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--fg4);line-height:1.55}
.tl-win::before{content:'→';color:var(--fg6);flex-shrink:0;font-size:12px;margin-top:1px}
.tl-toggle{font-size:11px;color:var(--fg5);transition:color var(--dur)}
.tl-header:hover .tl-toggle{color:var(--accent-bright)}

/* ── Skills ───────────────────────────────────────── */
.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.skill-card{padding:24px}
.skill-group-title{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:-.01em;
  margin-bottom:16px;display:flex;align-items:center;gap:8px}
.skill-group-title::before{content:'';width:3px;height:14px;background:var(--accent);
  border-radius:2px;display:block}
.skill-chips{display:flex;flex-direction:column;gap:6px}
.skill-chip{font-size:12px;font-weight:400;color:var(--fg4);padding:7px 12px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.05);
  transition:color var(--dur),border-color var(--dur),background var(--dur)}
.skill-chip:hover{color:var(--fg2);background:var(--accent-dim);border-color:var(--accent-border)}

[data-theme="editorial"] .skill-group-title{font-weight:300;letter-spacing:.02em;font-size:13px}
[data-theme="editorial"] .skill-chip{border-radius:2px;background:none;border-color:rgba(255,255,255,.06)}

/* ── About ────────────────────────────────────────── */
.about-inner{display:grid;grid-template-columns:1fr 200px;gap:72px;align-items:start}
.about-bio{font-size:15px;color:var(--fg4);line-height:1.85;margin-bottom:28px}
.about-bio strong{color:var(--fg2);font-weight:600}
.cert-list{display:flex;flex-direction:column;gap:10px}
.cert-item{display:flex;flex-direction:column;gap:2px;padding:14px 16px;
  border-left:2px solid var(--accent);background:rgba(255,255,255,.02);
  border-radius:0 var(--r-sm) var(--r-sm) 0}
.cert-label{font-size:13px;font-weight:600;color:var(--fg2)}
.cert-detail{font-size:11px;color:var(--fg5);font-family:var(--font-mono)}
.headshot-wrap{position:relative}
.headshot{width:100%;height:260px;object-fit:cover;object-position:center 8%;
  border-radius:var(--r-md);border:1px solid var(--card-border);
  transition:border-color var(--dur)}
.headshot-wrap:hover .headshot{border-color:var(--card-border-h)}

[data-theme="editorial"] .cert-item{border-radius:0;border-left-width:1px}
[data-theme="editorial"] .headshot{border-radius:2px}

/* ── Contact ──────────────────────────────────────── */
.contact-card{text-align:center;padding:72px 40px;position:relative;overflow:hidden}
.contact-card::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 50% 0%,var(--accent-dim),transparent 60%);pointer-events:none}
.contact-inner{position:relative;z-index:1}
.contact-title{font-size:clamp(28px,4vw,48px);font-weight:800;letter-spacing:-.03em;
  color:var(--fg1);margin-bottom:14px}
.contact-sub{font-size:16px;color:var(--fg4);margin-bottom:32px;font-weight:300}
.contact-links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:28px}
.contact-link{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  color:var(--fg4);padding:10px 18px;border-radius:var(--r-full);
  background:rgba(255,255,255,.04);border:1px solid var(--card-border);
  transition:color var(--dur),border-color var(--dur),background var(--dur)}
.contact-link:hover{color:var(--fg1);border-color:var(--card-border-h);background:rgba(255,255,255,.07)}
